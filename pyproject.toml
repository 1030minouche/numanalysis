[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "numanalysis"
dynamic = ["version"]
description = "Glass-box numerical analysis in pure Python: exact arithmetic, step-by-step traces, verified algorithms."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Amîn", email = "40297142+1030minouche@users.noreply.github.com" }]
keywords = [
    "numerical analysis",
    "linear algebra",
    "LU decomposition",
    "Cholesky",
    "exact arithmetic",
    "education",
    "pure python",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
plot = ["matplotlib>=3.8", "numpy>=1.26"]
mp = ["mpmath>=1.3"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "numpy>=1.26",
    "scipy>=1.11",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "build>=1.2",
    "twine>=5.1",
]
docs = [
    "sphinx>=7",
    "furo>=2024.1",
    "myst-nb>=1.1",
]

[project.urls]
Homepage = "https://github.com/1030minouche/numanalysis"
Documentation = "https://1030minouche.github.io/numanalysis/"
Repository = "https://github.com/1030minouche/numanalysis"
Issues = "https://github.com/1030minouche/numanalysis/issues"
Changelog = "https://github.com/1030minouche/numanalysis/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/numanalysis/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/numanalysis"]

[tool.hatch.build.targets.sdist]
include = [
    "src/numanalysis",
    "tests",
    "README.md",
    "README.fr.md",
    "CHANGELOG.md",
    "LICENSE",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "D", "PT", "C4"]
# Uppercase names (A, L, U, P) follow mathematical convention.
ignore = ["D105", "D107", "N803", "N806", "SIM300"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
strict = true
files = ["src", "tests"]
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["scipy.*", "hypothesis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["tests"]
testpaths = ["tests", "src", "README.md"]
addopts = [
    "--doctest-modules",
    "--doctest-glob=*.md",
    "--import-mode=importlib",
    "-ra",
    "--strict-markers",
]
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]
xfail_strict = true

[tool.coverage.run]
source = ["numanalysis"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "@overload", "raise NotImplementedError"]
